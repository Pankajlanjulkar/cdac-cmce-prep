name: Deploy Razorpay payment functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/create-razorpay-order/**"
      - "supabase/functions/verify-razorpay-payment/**"
      - ".github/workflows/deploy-razorpay-verification.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy order creation function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-razorpay-order --project-ref hnwduoyealnceyhmmskl --yes
      - name: Deploy payment verification function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy verify-razorpay-payment --project-ref hnwduoyealnceyhmmskl --yes
